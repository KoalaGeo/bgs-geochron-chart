server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/plain
        text/turtle
        image/svg+xml
        application/wasm;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /_nuxt/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /data/ {
        expires 1h;
        types {
            application/json json;
            text/turtle ttl;
        }
        default_type application/octet-stream;
    }

    # Convenience redirect if someone navigates to /chart/ when hosted at /
    location = /chart {
        return 302 /;
    }
    location = /chart/ {
        return 302 /;
    }

    # ------------------------------------------------------------------
    # Legacy BGS ColdFusion URLs (Lexicon & RCS)
    # ------------------------------------------------------------------
    location = /lexicon/lexicon.cfm {
        return 301 /lexicon/?$args;
    }
    location = /lexicon/lex_list.cfm {
        return 301 /lexicon/?$args;
    }
    location = /lexicon/home.cfm {
        return 301 /lexicon/;
    }
    location = /lexicon/SearchEngineIndex.cfm {
        return 301 /?tab=browse;
    }
    location = /bgsrcs {
        return 301 /rcs/;
    }
    location = /bgsrcs/ {
        return 301 /rcs/;
    }
    location = /bgsrcs/home.html {
        return 301 /rcs/;
    }
    location = /bgsrcs/search_rcs.cfm {
        return 301 /rcs/?$args;
    }
    location = /bgsrcs/rcs_details.cfm {
        return 301 /rcs/?rcsCode=$arg_code;
    }

    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
        expires 1h;
    }
}
